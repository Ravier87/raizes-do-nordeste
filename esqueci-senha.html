<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar senha - Raízes do Nordeste</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="topo">
        <img src="img/logo.png" alt="Logo Raízes do Nordeste">
        <h1>🌽 Raízes do Nordeste</h1>
    </header>

    <main class="pagina-login">
        <section class="login">
            <h2>Esqueci minha senha</h2>

            <p>
                Informe o e-mail utilizado no cadastro para verificar
                sua conta demonstrativa.
            </p>

            <form id="form-recuperacao">
                <label for="email-recuperacao">E-mail cadastrado</label>

                <input
                    type="email"
                    id="email-recuperacao"
                    placeholder="seuemail@exemplo.com"
                    required
                >

                <button type="submit" class="botao">
                    Verificar e-mail
                </button>

                <p id="mensagem-recuperacao" role="status"></p>
            </form>

            <p>
                <a href="login.html">Voltar para o login</a>
            </p>
        </section>
    </main>

    <script src="js/esqueci-senha.js"></script>
</body>
</html>
