<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Raízes do Nordeste</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="topo">
        <img src="img/logo.png" alt="Logo Raízes do Nordeste">
        <h1>🌽 Raízes do Nordeste</h1>
    </header>

    <main class="pagina-cadastro">
        <section class="cadastro">
            <h2>Criar Conta</h2>
            <p>Preencha os dados abaixo.</p>

            <form id="form-cadastro">
                <label for="nome">Nome completo</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Nome completo"
                    autocomplete="name"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seuemail@exemplo.com"
                    autocomplete="email"
                    required
                >

                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    autocomplete="tel"
                    required
                >

                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    required
                    minlength="8"
                >

                <label for="confirmar-senha">Confirmar senha</label>
                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    autocomplete="new-password"
                    required
                    minlength="8"
                >

                <label class="consentimento">
                    <input type="checkbox" id="consentimento" required>
                    <span>
                        Li e concordo com a
                        <a href="privacidade.html">Política de Privacidade</a>.
                    </span>
                </label>

                <button type="submit" class="botao">
                    Criar Conta
                </button>

                <p id="mensagem-cadastro" role="status"></p>
            </form>

            <p class="link-login">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>
        </section>
    </main>

    <script src="js/cadastro.js"></script>
</body>
</html>
